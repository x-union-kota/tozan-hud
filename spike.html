<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="description" content="登山HUD Phase0 スパイク: グラス実機のGPS/IMU/消灯挙動の計測専用ページ">
<meta name="mrbd-web-app-capable" content="yes">
<title>HUDスパイク計測</title>
<style>
html,body{background:#000;overflow:hidden;margin:0}
body{width:600px;height:600px;position:relative;user-select:none;
     font-family:'Courier New',ui-monospace,monospace;color:#f5f1e6;font-size:20px}
.y{color:#ffd83b}.d{color:#6b675c}.r{color:#ff5a60}.o{color:#f5a11c}
#v{position:absolute;top:14px;left:20px;right:20px;line-height:1.55;white-space:pre-wrap;font-size:19px}
#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:18px}
</style>
</head>
<body>
<div id="v"></div>
<div id="hint" class="d"></div>
<script>
/* ============================================================
 * Phase 0 スパイク — 要件定義のオープンクエスチョン検証用
 *  1) watchPosition の更新頻度・精度・消灯中の生死
 *  2) deviceorientation の種別(absolute?)・方位値の意味
 *  3) タイマーの消灯中挙動(ハートビート欠測でサスペンド検出)
 *  4) 再点灯時のイベント(visibilitychange/pageshow)
 *  + Battery API の有無 / 権限プロンプトの挙動・永続性
 *
 * ログ回収: 電波がある場所で Enter 2回目 → WEBHOOK_URL へPOST
 * (https://webhook.site 等でURLを発行して下の定数に貼る)
 * ============================================================ */
var WEBHOOK_URL = '';   // ←ここに貼る。空なら画面表示のみ

var st = {
  started: false, page: 0,
  fixN: 0, lastFixT: 0, ivals: [], lastAcc: null, lastFix: null,
  oriType: '-', oriN: 0, oriLastT: 0, oriRate: 0, alpha: null, wkc: null, absFlag: null,
  hbLast: 0, hbGaps: 0, hbMaxGap: 0,
  visN: 0, batt: '未確認', permGeo: '-', permOri: '-', sent: ''
};
var LOG = [];
function log(type, data) {
  LOG.push([Math.round(Date.now()/1000), type, data]);
  if (LOG.length > 500) LOG.shift();
  try { localStorage.setItem('spike.log', JSON.stringify(LOG.slice(-300))); } catch(e){}
}
try { var old = localStorage.getItem('spike.log'); if (old) LOG = JSON.parse(old); } catch(e){}

/* ---- 計測開始(ユーザージェスチャー必須: 公式仕様) ---- */
function start() {
  if (st.started) return; st.started = true;
  log('start', { ua: navigator.userAgent });
  // センサー権限
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      st.permOri = 'requestPermission呼出';
      DeviceOrientationEvent.requestPermission().then(function(r){
        st.permOri = r; log('perm-ori', r); attachOri();
      }, function(e){ st.permOri = '拒否/失敗'; log('perm-ori', 'reject'); });
    } else { st.permOri = '自動(関数なし)'; attachOri(); }
  } catch(e) { st.permOri = 'err'; attachOri(); }
  // 位置
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(function(p){
      var t = Date.now();
      if (st.lastFixT) { var dt = (t - st.lastFixT)/1000; st.ivals.push(dt); if (st.ivals.length > 60) st.ivals.shift(); }
      st.lastFixT = t; st.fixN++;
      st.lastAcc = p.coords.accuracy;
      st.lastFix = p;
      st.permGeo = 'OK';
      log('fix', { acc: Math.round(p.coords.accuracy),
                   spd: p.coords.speed, hd: p.coords.heading,
                   alt: p.coords.altitude == null ? null : Math.round(p.coords.altitude) });
    }, function(err){
      st.permGeo = 'エラー code=' + err.code;
      log('geo-err', err.code);
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  } else { st.permGeo = 'API無し'; }
  // バッテリー
  try {
    if (navigator.getBattery) {
      navigator.getBattery().then(function(b){
        st.batt = 'あり ' + Math.round(b.level*100) + '%'; log('batt', b.level);
      }, function(){ st.batt = 'reject'; });
    } else { st.batt = 'API無し'; log('batt', 'none'); }
  } catch(e) { st.batt = 'err'; }
}
function attachOri() {
  var abs = ('ondeviceorientationabsolute' in window);
  st.oriType = abs ? 'absoluteイベント' : '通常イベント';
  window.addEventListener(abs ? 'deviceorientationabsolute' : 'deviceorientation', function(e){
    var t = Date.now();
    st.oriN++;
    if (st.oriLastT) st.oriRate = 0.9*st.oriRate + 0.1*(1000/(t - st.oriLastT));
    st.oriLastT = t;
    st.alpha = e.alpha; st.wkc = e.webkitCompassHeading; st.absFlag = e.absolute;
    if (st.oriN % 30 === 1) log('ori', { a: e.alpha == null ? null : Math.round(e.alpha),
      wkc: e.webkitCompassHeading == null ? null : Math.round(e.webkitCompassHeading),
      abs: e.absolute, b: e.beta == null ? null : Math.round(e.beta) });
  });
}

/* ---- 消灯サスペンド検出: 1秒ハートビートの欠測を測る ---- */
st.hbLast = Date.now();
setInterval(function(){
  var t = Date.now(), gap = (t - st.hbLast)/1000;
  st.hbLast = t;
  if (gap > 2.5) { st.hbGaps++; st.hbMaxGap = Math.max(st.hbMaxGap, gap); log('hb-gap', Math.round(gap*10)/10); }
  render();
}, 1000);
document.addEventListener('visibilitychange', function(){
  st.visN++; log('vis', document.visibilityState);
});
window.addEventListener('pageshow', function(){ log('pageshow', 1); });
window.addEventListener('pagehide', function(){ log('pagehide', 1); });

/* ---- 送信 ---- */
function send() {
  if (!WEBHOOK_URL) { st.sent = 'URL未設定(コード内 WEBHOOK_URL)'; render(); return; }
  st.sent = '送信中…'; render();
  try {
    fetch(WEBHOOK_URL, { method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ua: navigator.userAgent, at: Date.now(), log: LOG })
    }).then(function(){ st.sent = '送信した(no-cors応答不明)'; log('sent',1); render(); },
            function(){ st.sent = '失敗'; render(); });
  } catch(e) { st.sent = '失敗'; render(); }
}

/* ---- 表示 ---- */
function avg(a){ if(!a.length) return null; var s=0; for(var i=0;i<a.length;i++)s+=a[i]; return s/a.length; }
function statsView() {
  var iv = avg(st.ivals);
  var oriAge = st.oriLastT ? (Date.now()-st.oriLastT)/1000 : null;
  var fixAge = st.lastFixT ? (Date.now()-st.lastFixT)/1000 : null;
  return [
    '<span class="o">── スパイク計測 ──</span>',
    'GPS権限   : ' + st.permGeo,
    'fix数     : <span class="y">' + st.fixN + '</span>' + (fixAge!=null ? '  (最終 '+fixAge.toFixed(0)+'s前)' : ''),
    '更新間隔  : ' + (iv ? '<span class="y">'+iv.toFixed(1)+'s</span> 平均' : '--'),
    '精度      : ' + (st.lastAcc!=null ? '±'+Math.round(st.lastAcc)+'m' : '--') +
      (st.lastFix ? '  alt:'+(st.lastFix.coords.altitude==null?'null':'あり')+' spd:'+(st.lastFix.coords.speed==null?'null':'あり') : ''),
    '',
    'IMU権限   : ' + st.permOri,
    'IMU種別   : ' + st.oriType + (st.absFlag!=null ? ' absolute='+st.absFlag : ''),
    'IMU頻度   : ' + (st.oriRate ? st.oriRate.toFixed(0)+'Hz' : '--') + (oriAge!=null&&oriAge>3?' <span class="r">停止?</span>':''),
    'alpha     : ' + (st.alpha==null?'null':Math.round(st.alpha)+'°') + '   wkCompass: ' + (st.wkc==null?'null':Math.round(st.wkc)+'°'),
    '<span class="d">→ 体を北に向けて値をメモ(方位の意味を確定)</span>',
    '',
    '<span class="o">消灯テスト: 画面を60秒消灯→再点灯</span>',
    'HB欠測    : ' + (st.hbGaps ? '<span class="r">'+st.hbGaps+'回 最大'+st.hbMaxGap.toFixed(0)+'s</span>' : 'なし') +
      '   vis変化:' + st.visN + '回',
    '<span class="d">欠測あり=消灯中JS停止(プル型設計で正解)</span>',
    'Battery   : ' + st.batt,
    (st.sent ? '送信: ' + st.sent : '')
  ].join('\n');
}
function logView(page) {
  var per = 14, pages = Math.max(1, Math.ceil(LOG.length/per));
  page = ((page % pages) + pages) % pages;
  var i0 = Math.max(0, LOG.length - (page+1)*per), i1 = LOG.length - page*per;
  var out = ['<span class="o">── ログ '+(page+1)+'/'+pages+' (新しい順は1) ──</span>'];
  for (var i = i1-1; i >= i0; i--) {
    var e = LOG[i];
    out.push('<span class="d">'+new Date(e[0]*1000).toTimeString().slice(0,8)+'</span> '+e[1]+' '+JSON.stringify(e[2]));
  }
  return out.join('\n');
}
function render() {
  document.getElementById('v').innerHTML = (st.page === 0) ? statsView() : logView(st.page - 1);
  document.getElementById('hint').innerHTML = st.started
    ? 'ピンチ:ログ送信　←→:ログ頁　中指:戻る'
    : '<span class="y">ピンチで計測開始</span>(権限プロンプトが出るか確認)';
}
window.addEventListener('keydown', function(e){
  var k = e.key;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Escape'].indexOf(k) < 0) return;
  e.preventDefault();
  if (k === 'Enter') { if (!st.started) start(); else send(); }
  if (k === 'ArrowRight') st.page++;
  if (k === 'ArrowLeft') st.page--;
  if (k === 'ArrowUp') st.page = 0;
  if (k === 'Escape') { try{ history.back(); }catch(err){} }
  render();
});
document.addEventListener('mousedown', function(e){
  window.dispatchEvent(new KeyboardEvent('keydown',{key: e.clientX<200?'ArrowLeft':(e.clientX>400?'ArrowRight':'Enter')}));
});
render();
</script>
</body>
</html>
